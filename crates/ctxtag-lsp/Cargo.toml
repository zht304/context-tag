[package]
name = "ctxtag-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ctx-lsp"
path = "src/main.rs"

[dependencies]
ctxtag-core = { path = "../ctxtag-core" }
lsp-server = "0.7"
lsp-types = "0.95"
tokio = { version = "1", features = ["full"] }
notify = "6"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
