[package]
name = "ctxtag-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
sha2 = "0.10"
regex = "1"
anyhow = "1"
tracing = "0.1"

[build-dependencies]
cc = "1"
